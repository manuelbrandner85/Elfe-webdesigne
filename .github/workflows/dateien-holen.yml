name: Dateien holen

# Holt erzeugte Mediendateien und legt sie ins Repository.
#
# WARUM ES DIESEN UMWEG BRAUCHT
#
# Die Bauumgebung, in der die Seite entwickelt wird, erreicht keinen
# einzigen Medien-Anbieter: kie.ai, Replicate, Hugging Face, fal,
# Pollinations, OpenAI, Together, Leonardo, Luma, Runway - alle
# antworten mit host_not_allowed. Erreichbar sind nur die
# Programmschnittstellen (api.kie.ai), nicht die Dateien, die sie
# ausliefern. Auch die signierte Cloudflare-Adresse, die kie.ai ueber
# /common/download-url herausgibt, ist gesperrt.
#
# Ein Actions-Läufer hat dagegen freien Netzzugang. Er laedt die
# Dateien und legt sie ab - der Umweg dauert eine Minute und loest ein
# Problem, das sonst gar nicht loesbar waere.
#
# Die Adressen sind kurzlebige, oeffentliche Ergebnisdateien. Sie
# stehen in den Eingaben des Laufs; das ist vertretbar. Der API-
# Schluessel taucht hier bewusst NICHT auf: Erzeugt wird vorher, der
# Laeufer laedt nur noch herunter.

on:
  workflow_dispatch:
    inputs:
      dateien:
        description: 'JSON: [{"url":"...","ziel":"public/images/..."}]'
        required: true
        type: string
      nachricht:
        description: "Text der Festschreibung"
        required: false
        default: "Medien geholt"
        type: string

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install sharp --no-save

      # Der Schritt bricht bewusst NICHT ab, sondern schreibt einen
      # Bericht ins Repository. Grund: Die Laufprotokolle liegen auf
      # einem Azure-Speicher, den die Bauumgebung nicht erreicht - ein
      # fehlgeschlagener Lauf waere von dort aus eine schwarze Kiste.
      # Der Bericht kommt mit dem naechsten git fetch mit.
      - name: Herunterladen
        env:
          DATEIEN: ${{ inputs.dateien }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          liste = json.loads(os.environ["DATEIEN"])
          zeilen = []
          for e in liste:
              ziel = pathlib.Path(e["ziel"])
              if ".." in ziel.parts or ziel.is_absolute():
                  zeilen.append(f"ABGELEHNT  {ziel}  (unzulaessiger Pfad)")
                  continue
              ziel.parent.mkdir(parents=True, exist_ok=True)
              try:
                  a = urllib.request.Request(e["url"], headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(a, timeout=180) as r:
                      daten = r.read()
                  ziel.write_bytes(daten)
                  zeilen.append(f"OK         {ziel}  {len(daten)/1024:.0f} KB")
              except Exception as x:
                  zeilen.append(f"FEHLER     {ziel}  {type(x).__name__}: {x}")
          bericht = "\n".join(zeilen)
          print(bericht)
          pathlib.Path("werkzeug/holen-bericht.txt").write_text(bericht + "\n", encoding="utf-8")
          PY

      # Umgewandelt wird auf dem Laeufer, nicht hier.
      #
      # Grund: werkzeug/roh/ steht auf der Ignorierliste - 72 MB PNG
      # gehoeren nicht in die Historie. Genau deshalb hat der Laeufer beim
      # ersten Anlauf zwar alles heruntergeladen, aber nichts
      # festgeschrieben: `git add` respektiert die Ignorierliste. Das
      # Rohmaterial existierte nur fuer die Dauer des Laufs.
      #
      # Also wandelt der Laeufer selbst um. Was zurueckkommt, sind die
      # rund 40 KB grossen Auslieferungsdateien - und die duerfen ins
      # Repository.
      - name: Umwandeln
        if: always()
        run: |
          node -e "
          const sharp=require('sharp'), fs=require('fs');
          const q='werkzeug/roh';
          if(!fs.existsSync(q)) process.exit(0);
          fs.mkdirSync('public/images/tiles',{recursive:true});
          (async()=>{
            for (const d of fs.readdirSync(q).filter(f=>f.endsWith('.png'))) {
              const n=d.replace(/\.png\$/,'');
              for (const b of [640,360]) {
                const k=sharp(q+'/'+d)
                  .resize(b, Math.round(b*3/4), {fit:'cover', kernel:'lanczos3'})
                  .sharpen({sigma:0.6,m1:0.4,m2:0.9});
                await k.clone().avif({quality:56,effort:6}).toFile('public/images/tiles/foto-'+n+'-'+b+'.avif');
                await k.clone().webp({quality:80,effort:6}).toFile('public/images/tiles/foto-'+n+'-'+b+'.webp');
              }
              console.log('umgewandelt', n);
            }
          })()"

      # Video wird ebenfalls auf dem Laeufer verkleinert. Was Veo
      # ausliefert, sind zweistellige Megabyte; auf der Seite laeuft es
      # hinter einem Schleier und unter Text. Zwei Fassungen, weil kein
      # Format ueberall das guenstigere ist: VP9 ist meist kleiner,
      # H.264 laeuft ueberall.
      #
      # Ohne Ton: Ein Hintergrundvideo, das ungefragt Ton mitbringt,
      # waere ein Fehler - und die Tonspur kostet Bytes fuer nichts.
      # Der Schritt darf nicht abbrechen, sondern schreibt seinen Befund
      # in den Bericht - die Laufprotokolle liegen auf einem Speicher,
      # den die Bauumgebung nicht erreicht. Zweimal hat dieser Schritt
      # bereits fehlgeschlagen, ohne dass von hier aus erkennbar war,
      # woran.
      - name: Video verkleinern
        if: always()
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob
          if ! command -v ffmpeg >/dev/null; then
            echo "ffmpeg fehlt, wird nachinstalliert" >> werkzeug/holen-bericht.txt
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          echo "ffmpeg: $(ffmpeg -version 2>&1 | head -1)" >> werkzeug/holen-bericht.txt
          mkdir -p public/videos
          for f in werkzeug/roh/*.mp4; do
            n=$(basename "$f" .mp4)
            ffmpeg -v error -y -i "$f" -an -vf "scale='min(1600,iw)':-2" -c:v libx264 -crf 30 -preset slow -movflags +faststart "public/videos/$n.mp4"
            ffmpeg -v error -y -i "$f" -an -vf "scale='min(1600,iw)':-2" -c:v libvpx-vp9 -crf 40 -b:v 0 -row-mt 1 "public/videos/$n.webm" || echo "VP9 nicht verfuegbar, nur H.264"
            for a in "public/videos/$n".*; do
              echo "VIDEO $a  $(stat -c%s "$a") Bytes" >> werkzeug/holen-bericht.txt
            done
          done
          exit 0

      - name: Festschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts geaendert."
          else
            git commit -m "${{ inputs.nachricht }}"
            git push
          fi
